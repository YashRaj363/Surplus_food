<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusShare — Register</title>
  <style>
    /* Complete CSS for Registration Page */
    :root {
      --primary: #4CAF50; /* Green */
      --primary-dark: #388E3C;
      --secondary: #FF9800; /* Orange */
      --accent: #2196F3; /* Blue */
      --light: #F5F5F5;
      --dark: #333333;
      --text: #424242;
      --gray: #e0e0e0;
      --gray-dark: #b0b0b0;
      
      --radius-sm: 4px;
      --radius-md: 8px;
      
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
    }
    
    body {
      background-color: #f9f9f9;
      background-image: 
        linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)),
        url('https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2.5rem;
      text-align: center;
      border-top: 5px solid var(--primary);
      transform: translateY(0);
      animation: fadeInUp 0.6s ease-out;
    }
    
    .auth-card h2 {
      color: var(--primary-dark);
      margin-bottom: 1.8rem;
      font-size: 1.8rem;
      position: relative;
      padding-bottom: 10px;
    }
    
    .auth-card h2::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--secondary);
      border-radius: 3px;
    }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      margin-top: 1.5rem;
    }
    
    .input-group {
      text-align: left;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark);
      font-size: 0.95rem;
    }
    
    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--gray);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
      background-color: white;
      appearance: none;
    }
    
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 15px;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    input::placeholder {
      color: var(--gray-dark);
    }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.8rem;
    }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .footer-text {
      margin-top: 1.8rem;
      color: var(--text);
      font-size: 0.95rem;
    }
    
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }
    
    a:hover {
      text-decoration: underline;
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Food-themed decorative elements */
    .auth-card::before {
      content: "👥";
      font-size: 2.2rem;
      display: block;
      margin-bottom: 1rem;
    }
    
    /* Responsive adjustments */
    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
      
      body {
        padding: 1rem;
        align-items: flex-start;
        padding-top: 3rem;
      }
    }
  </style>
</head>
<body class="center-page">
  <main class="card auth-card">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="input-group">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" placeholder="Your name" required>
      </div>
      
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@college.edu" required>
      </div>
      
      <div class="input-group">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="student">Student</option>
          <option value="staff">Staff</option>
          <option value="ngo">NGO</option>
          <option value="provider">Provider (Canteen/Hostel/Event)</option>
        </select>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••" required>
      </div>
      
      <button type="submit" class="btn">Create account</button>
    </form>
    
    <p class="footer-text">Already a user? <a href="http://127.0.0.1:5500/app/2/login.html">Login</a></p>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, role, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registration successful! Please log in.');
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Registration failed');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      }
    });
  </script>
</body>
</html>
