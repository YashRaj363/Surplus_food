<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusShare — Login</title>
  <style>
    /* Complete CSS for Login Page - No Dependencies Needed */
    :root {
      --primary: #4CAF50; /* Green */
      --primary-dark: #388E3C;
      --secondary: #FF9800; /* Orange */
      --accent: #2196F3; /* Blue */
      --light: #F5F5F5;
      --dark: #333333;
      --text: #424242;
      --gray: #e0e0e0;
      
      --radius-sm: 4px;
      --radius-md: 8px;
      
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
    }
    
    body {
      background-color: #f9f9f9;
      background-image: 
        linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)),
        url('https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 2.5rem;
      text-align: center;
      border-top: 5px solid var(--primary);
      transform: translateY(0);
      animation: fadeInUp 0.6s ease-out;
    }
    
    .auth-card h2 {
      color: var(--primary-dark);
      margin-bottom: 1.8rem;
      font-size: 1.8rem;
      position: relative;
      padding-bottom: 10px;
    }
    
    .auth-card h2::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--secondary);
      border-radius: 3px;
    }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .input-group {
      text-align: left;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark);
      font-size: 0.95rem;
    }
    
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--gray);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: var(--transition);
    }
    
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text);
    }
    
    .checkbox input {
      width: auto;
    }
    
    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
    }
    
    a:hover {
      text-decoration: underline;
    }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .footer-text {
      margin-top: 1.8rem;
      color: var(--text);
      font-size: 0.95rem;
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Food-themed decorative elements */
    .auth-card::before {
      content: "🍽️";
      font-size: 2.2rem;
      display: block;
      margin-bottom: 1rem;
    }
    
    /* Responsive adjustments */
    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
      }
      
      body {
        padding: 1rem;
        align-items: flex-start;
        padding-top: 3rem;
      }
    }
  </style>
</head>
<body class="center-page">
  <main class="card auth-card">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@college.edu" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••" required>
      </div>
      
      <div class="row">
        <label class="checkbox">
          <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      
      <button type="submit" class="btn">Login</button>
    </form>
    
    <p class="footer-text">New here? <a href="http://127.0.0.1:5500/app/3/register.html">Create an account</a></p>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Save the token to localStorage
          localStorage.setItem('token', data.token);
          // Redirect to the profile page
          window.location.href = 'profile.html';
        } else {
          // Display an error message
          alert(data.message || 'Login failed');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      }
    });
  </script>
</body>
</html>
